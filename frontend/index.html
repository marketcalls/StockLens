<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockLens</title>
    <meta
      name="description"
      content="Stock analysis and screening tool for investors in India."
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme. Mirrors providers/theme-provider.tsx: a stored choice
      // wins, otherwise fall back to the operating system preference once.
      (function () {
        try {
          var stored = localStorage.getItem("stocklens-theme")
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
        } catch (e) {
          document.documentElement.classList.add("light")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
